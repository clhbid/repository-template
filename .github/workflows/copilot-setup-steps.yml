# Prepares the Copilot cloud agent's environment before each run. The job must be named
# copilot-setup-steps: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Install the repo's dependencies here, for example `npm ci`, so the agent can build and test
      # straight away.

      - name: Install agent skills
        run: ./scripts/install-agent-skills.sh github-copilot

      # Pilot for clhbid/agent-context#85: Copilot's skill tool can't load ~/.agents/skills.
      # One skill per candidate location shows which one it loads; .git/info/exclude keeps the
      # repo copy out of commits.
      - name: Expose skills to Copilot's skill tool
        run: |
          mkdir -p ~/.copilot/skills .github/skills
          cp -r ~/.agents/skills/open-pr ~/.copilot/skills/
          cp -r ~/.agents/skills/writing-lean .github/skills/
          echo .github/skills/ >> .git/info/exclude

      - name: List installed skills
        run: ls -l ~/.agents/skills
